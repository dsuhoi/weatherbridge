name: weatherbridge

x-worker-common: &worker-common
  build:
    context: ..
    dockerfile: production/Dockerfile.worker
  restart: unless-stopped
  environment:
    WB_INBOX: /var/lib/weatherbridge/inbox
    WB_ARCHIVE: /var/lib/weatherbridge/archive
    WB_FORECAST_STORE: /var/lib/weatherbridge/store
    WB_MODEL_PATH: /weights/weatherbridge_14m_6h_bare.pt
    WB_MODEL_SHA256: d3ba687b6309748925016019dc7a0dc1f923ef6f4207d365ccd9ade7f7e5eafc
    WB_STATIC_PATH: /data/static_features_0p5.pt
    WB_STATS_PATH: /data/json_stats_0p5.nc
    WB_SURFACE_STATS_PATH: /data/surface_stats_0p5.json
  volumes:
    - ${WB_INBOX_DIR:-./runtime/inbox}:/var/lib/weatherbridge/inbox
    - ${WB_ARCHIVE_DIR:-./runtime/archive}:/var/lib/weatherbridge/archive
    - forecast-store:/var/lib/weatherbridge/store
    - ${WB_WEIGHTS_DIR:-../weights}:/weights:ro
    - ${WB_DATA_DIR:-../data}:/data:ro

services:
  api:
    build:
      context: ..
      dockerfile: production/Dockerfile.api
    restart: unless-stopped
    environment:
      WB_FORECAST_STORE: /var/lib/weatherbridge/store
      WB_STALE_AFTER_SECONDS: ${WB_STALE_AFTER_SECONDS:-28800}
    volumes:
      - forecast-store:/var/lib/weatherbridge/store:ro
    ports:
      - ${WB_HTTP_PORT:-8080}:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true

  worker-gpu:
    <<: *worker-common
    profiles: ["gpu"]
    environment:
      WB_INBOX: /var/lib/weatherbridge/inbox
      WB_ARCHIVE: /var/lib/weatherbridge/archive
      WB_FORECAST_STORE: /var/lib/weatherbridge/store
      WB_MODEL_PATH: /weights/weatherbridge_14m_6h_bare.pt
      WB_MODEL_SHA256: d3ba687b6309748925016019dc7a0dc1f923ef6f4207d365ccd9ade7f7e5eafc
      WB_STATIC_PATH: /data/static_features_0p5.pt
      WB_STATS_PATH: /data/json_stats_0p5.nc
      WB_SURFACE_STATS_PATH: /data/surface_stats_0p5.json
      WB_DEVICE: cuda
    gpus: all
    shm_size: 2gb
    security_opt:
      - no-new-privileges:true

  worker-cpu:
    <<: *worker-common
    profiles: ["cpu"]
    environment:
      WB_INBOX: /var/lib/weatherbridge/inbox
      WB_ARCHIVE: /var/lib/weatherbridge/archive
      WB_FORECAST_STORE: /var/lib/weatherbridge/store
      WB_MODEL_PATH: /weights/weatherbridge_14m_6h_bare.pt
      WB_MODEL_SHA256: d3ba687b6309748925016019dc7a0dc1f923ef6f4207d365ccd9ade7f7e5eafc
      WB_STATIC_PATH: /data/static_features_0p5.pt
      WB_STATS_PATH: /data/json_stats_0p5.nc
      WB_SURFACE_STATS_PATH: /data/surface_stats_0p5.json
      WB_DEVICE: cpu
    security_opt:
      - no-new-privileges:true

  dev-seed:
    build:
      context: ..
      dockerfile: production/Dockerfile.worker
    profiles: ["demo"]
    command: ["python", "-m", "production.weatherbridge_app.dev_seed", "--store", "/var/lib/weatherbridge/store"]
    volumes:
      - forecast-store:/var/lib/weatherbridge/store

volumes:
  forecast-store:
