<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>WeatherBridge Live</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>WeatherBridge</h1>
      <p>Live global interpolation</p>
    </div>
    <div class="status" aria-live="polite">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Connecting</span>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Forecast controls">
      <label>Run<select id="run-select"></select></label>
      <label>Field<select id="field-select"></select></label>
      <fieldset>
        <legend>Interpolation hour</legend>
        <div id="tau-control" class="segments"></div>
      </fieldset>
      <button id="refresh" type="button">Refresh</button>
    </section>

    <section class="map-section" aria-labelledby="map-title">
      <div class="map-heading">
        <div>
          <h2 id="map-title">Forecast field</h2>
          <p id="valid-time">No forecast loaded</p>
        </div>
        <div id="model-name" class="model-name"></div>
      </div>
      <div class="map-frame">
        <img id="forecast-map" alt="Global WeatherBridge forecast field" width="1440" height="720">
        <div id="empty-state" class="empty-state">Waiting for the first published forecast</div>
      </div>
      <div class="legend" aria-label="Colour scale">
        <span id="legend-min">--</span>
        <div id="legend-ramp" class="legend-ramp"></div>
        <span id="legend-max">--</span>
      </div>
    </section>

    <section class="metrics" aria-label="Forecast metadata">
      <dl><dt>Mean</dt><dd id="metric-mean">--</dd></dl>
      <dl><dt>Range</dt><dd id="metric-range">--</dd></dl>
      <dl><dt>Source</dt><dd id="metric-source">--</dd></dl>
      <dl><dt>Grid</dt><dd id="metric-grid">--</dd></dl>
    </section>
  </main>

  <script src="/assets/app.js" defer></script>
</body>
</html>
