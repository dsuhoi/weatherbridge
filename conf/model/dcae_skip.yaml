# WeatherDCAE-Skip — 14.4M skip-path ablation (4-stage).
name: dcae_skip
kind: hermite
model_type: dcae_adaln_skip_residual_linear
latent_channels: 256
lat_crop: -8
block_out_channels: [128, 128, 256, 256]
layers_per_block: [2, 2, 2, 2]
freeze_skip_gates: false
direct_prediction: false
lat_weighted_loss: true
lambda_residual: 1.0
residual_scale_floor: 0.05
residual_scale_init: 0.30
lambda_anchor: 0.5
anchor_every_n_batches: 4
use_aurora_weights: true
lr: 1e-4
weight_decay: 1e-5
env_vars: {}
