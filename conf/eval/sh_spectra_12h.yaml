# SH (spherical-harmonics) angular power spectrum eval for the 12h paper.
# Routes to tools/eval/sh_energy_spectra_12h.main().
#
# IMPORTANT: For S-DYff/ModAFNO ckpts you MUST also export the relevant
# env vars BEFORE running `python eval.py ...`:
#   export SDYFF_NLAT=360 SDYFF_NLON=720 SDYFF_LAT_CROP=0
# Those are read at IMPORT time of trainer_weather_hermite, BEFORE Hydra
# composes; setting them in `eval.sh_envs` works for the _model_ but not
# for the dataset class. (See `docs/HYDRA_MIGRATION_PLAN.md` follow-ups.)
name: sh_spectra_12h
kind: sh_spectra_12h
memmap_dir: ${oc.env:MEMMAP_DIR,/tmp/wb2_0p5_cache}
test_year: 2020
stats_path: data/json_stats_0p5.nc
surface_stats_path: data/surface_stats_0p5.json
static_path: data/static_features_0p5.pt
ckpt: ${oc.env:CKPT,???}
model_name: ${oc.env:MODEL_NAME,model}
sh_model_kind: hermite          # hermite | atm_vfi | bilinear
sh_envs: null                   # e.g. "SDYFF_NLAT=360 SDYFF_NLON=720 SDYFF_LAT_CROP=0"
out_dir: metrics/sh_spectra_12h_ep10
sh_taus: "2,3,5,8"
sh_channels: "t2m,mslp,u10,v10,T850"
sh_lmax: 180
keep_n_channels: 24
batch_size: 2
samples_per_date: 2
eval_days_per_month: 2
max_tau_hours: 12
device: null
sh_skip_existing: false
# unused for this kind but needed for shared EvalConfig schema
climatology: ${oc.env:CLIMATOLOGY,/workspace-SR006.nfs2/weather_data/time_interpolation_0p5/climatology_1990-2019_0p5_canonical_v2.zarr}
