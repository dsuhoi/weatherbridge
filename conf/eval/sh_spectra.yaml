# SH spectra ensemble eval — single vs ens-mean vs gt comparison, lmax modes.
# Routes to tools/eval/sh_spectra_ens_sdyff.main().
name: sh_spectra
kind: sh_spectra
memmap_dir: ${oc.env:MEMMAP_DIR,/tmp/wb2_0p5_cache}
test_year: 2020
batch_size: 2
num_workers: 2
samples_per_date: 4
max_tau_hours: 6
ckpt: ${oc.env:SDYFF_CKPT,???}
n_ensemble: 16
sh_n_dates: 24
sh_tau_hours: 3
sh_channels: t2m,u10,v10,mslp
sh_lmax: 180
sh_envs: "SDYFF_NLAT=360 SDYFF_NLON=720 SDYFF_LAT_CROP=0"
model_name: sdyff
out_dir: metrics/sh_spectra_ens
