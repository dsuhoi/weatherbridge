# Region × season RMSE breakdown at 6h horizon.
# Routes to tools/eval/region_season_eval.main().
#
# 5 regions: tropics, midlatitudes_{N,S}, polar_{N,S} (lat-bands)
# 4 seasons: DJF, MAM, JJA, SON (calendar)
# Per-channel lat-cosine-weighted RMSE per (region, season, hour∈[0..6]).
#
# Output: ${out_dir}/${model_name}.json per model in `models` list.
name: region_season_6h
kind: region_season_6h
memmap_dir: ${oc.env:MEMMAP_DIR,/tmp/wb2_0p5_cache}
test_year: 2020
stats_path: data/json_stats_0p5.nc
surface_stats_path: data/surface_stats_0p5.json
static_path: data/static_features_0p5.pt
batch_size: 4
num_workers: 2
samples_per_date: 4
eval_days_per_month: 4
out_dir: metrics/region_season_2020
# set via CLI: ++eval.models='name1:ckpt1,name2:ckpt2[:ENV=val]'
models: ""
# unused for this kind but needed for shared EvalConfig schema
climatology: ${oc.env:CLIMATOLOGY,/workspace-SR006.nfs2/weather_data/time_interpolation_0p5/climatology_1990-2019_0p5_canonical_v2.zarr}
