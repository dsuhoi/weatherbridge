# 1° ERA5 legacy dataset (paper Appendix A8).  26 channels: drops sst/tcc/tcwv vs 0.5°.
# NOTE: This config preserves the legacy path used by legacy/train_weather_hermite.py.
# The dataset class is WeatherInterpDataset (zarr/parquet-backed, NOT memmap).
# Migrating to memmap is an open follow-up; left as-is for paper reproducibility.
name: era5_1deg
memmap_dir: ${oc.env:MEMMAP_DIR,/workspace/code/wti/data/era5_1deg}
static_path: ${oc.env:STATIC_PATH,data/static_features.pt}
stats_path: ${oc.env:STATS_PATH,data/json_stats.nc}
surface_stats_path: ${oc.env:SURFACE_STATS_PATH,data/surface_stats.json}
years: [2016, 2017, 2018, 2019]
val_years: [2020]
max_tau_hours: 6
delta_t_hours: 6.0
samples_per_date: 4
samples_per_date_train: 4
samples_per_date_val: 1
train_hours: [1, 2, 3, 4, 5]
eval_hours: [1, 2, 3, 4, 5]
keep_24ch: false       # legacy 26ch (no tcc/tcwv/sst)
n_pl_channels: 20
n_surface_channels: 6
n_static_features: 5
